    <p class="hand hand--sm">Thursday NightLife at the Academy</p>

  <section class="stage stage--hero" aria-label="Your host">

    <span class="char char--240 char--idle" role="img" data-character="hosts/rocco/greeting" aria-label="Rocco the raccoon, waving hello"></span>

      <p class="muted">Rocco and friends host a game of trivia every Thursday night.</p>

    <p class="body">Scan the QR code on the big screen to join tonight's game.</p>
  </div>

    <a class="btn btn--primary btn--block" href="join-nickname.html">Let me try the demo!</a>
