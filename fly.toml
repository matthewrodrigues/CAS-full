# Fly.io config for NightLife Trivia. Exactly one machine with one volume: timers, WebSocket rooms
# and the SQLite file all live in one process (docs/SPEC.md section 10). The passcodes are Fly
# secrets (`fly secrets set`), never in this file. Deploy steps: docs/RUNBOOK.md.

app = "nightlife-trivia" # must be unique on Fly: change it before the first deploy
primary_region = "sjc" # San Jose, the closest region to the Academy

[build]
  dockerfile = "Dockerfile"

[env]
  DATA_DIR = "/data"
  PORT = "3000"

# The SQLite database, media and backups.
[[mounts]]
  source = "nightlife_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Always on: a stopped machine would lose the question clock and every phone's connection.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  # Every phone holds a WebSocket open, and Fly's default limit is only 25 connections per machine.
  [http_service.concurrency]
    type = "connections"
    soft_limit = 400
    hard_limit = 500

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
